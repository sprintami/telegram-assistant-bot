<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Верстак</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/feather-icons/4.29.0/feather.min.js"></script>
<style>
  /* Верстак committed to one visual world deliberately — a dark neon
     control-room, per the exact palette/mood the client pinned down —
     so this stays single-theme rather than swapping light/dark. */
  :root{
    /* Обновляется JS-ом из visualViewport.height — 1% от РЕАЛЬНО видимой высоты экрана,
       которая у мобильных браузеров/Telegram-WebView не совпадает с обычным vh/dvh,
       когда открыта системная клавиатура (та просто не уменьшает vh, отчего модалки
       и чат схлопывались в узкую полоску). calc(var(--app-vh)*N) — надёжная замена Nvh. */
    --app-vh: 1vh;
    --bg:#0e0e10;
    --surface:#1a1a1d;
    --surface-2:#232327;
    --border:rgba(255,255,255,.09);
    --ink:#f4f3ef;
    --ink-muted:#a19d93;
    --ink-faint:#66635c;
    --accent:#ff6a2c;
    --accent-ink:#2b0d02;
    --accent-soft:rgba(255,106,44,.18);
    --ok:#2fe7c9;
    --ok-ink:#062420;
    --ok-soft:rgba(47,231,201,.16);
    --warn:var(--accent);
    --warn-ink:var(--accent-ink);
    --warn-soft:var(--accent-soft);
    --danger:#ff3b6b;
    --danger-soft:rgba(255,59,107,.18);
    --deco-pink:#e63f8f;
    --term-bg:#0a0a0b;
    --term-ink:#f2f1ec;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 20px 50px -20px rgba(0,0,0,.65);
    --r-lg: 24px;
    --r-md: 18px;
    --r-sm: 12px;
    --r-pill: 999px;
    color-scheme: dark;
  }

  *{ box-sizing:border-box; }
  .bg-fx{ position:fixed; inset:0; overflow:hidden; z-index:0; pointer-events:none; }
  .bg-fx .blob{ position:absolute; border-radius:50%; filter:blur(90px); }
  .bg-fx .blob-lime{ width:560px; height:560px; background:var(--accent); opacity:.20; bottom:-220px; left:10%; }
  .bg-fx .blob-warn{ width:460px; height:460px; background:var(--deco-pink); opacity:.13; top:-140px; right:-120px; }
  .bg-fx .blob-ok{ width:520px; height:520px; background:var(--ok); opacity:.10; top:-160px; left:-160px; }
  .bg-fx .grain{ position:absolute; inset:-50%; width:200%; height:200%; opacity:.05; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"); }
  #app{ position:relative; z-index:1; }
  body{ background:var(--bg); color:var(--ink); font-family:'Manrope', system-ui, sans-serif; -webkit-font-smoothing:antialiased; }
  h1,h2,h3,.display{ font-family:'Sora', system-ui, sans-serif; }
  .mono{ font-family:'JetBrains Mono', ui-monospace, monospace; }
  svg.feather{ width:15px; height:15px; stroke-width:2; vertical-align:-3px; }

  #app{ max-width:1180px; margin:0 0 0 208px; padding:calc(28px + env(safe-area-inset-top)) 24px 100px; }

  /* ---- black fill behind a phone's status bar / notch, so content never sits under it ---- */
  .safe-top-fill{ position:fixed; top:0; left:0; right:0; height:env(safe-area-inset-top); background:#000; z-index:100; pointer-events:none; }

  /* ---- persistent left rail: switches modules, stays on screen no matter how far you scroll ---- */
  .nav-rail{ position:fixed; top:0; left:0; bottom:0; width:208px; background:var(--surface); border-right:1px solid var(--border); z-index:40; display:flex; flex-direction:column; padding:calc(22px + env(safe-area-inset-top)) 12px 22px; gap:2px; overflow-y:auto; }
  .nav-brand{ display:flex; align-items:center; gap:9px; padding:2px 10px 20px; font-family:'Sora'; font-weight:700; font-size:15px; }
  .nav-brand i{ color:var(--accent); }
  .nav-item{ appearance:none; border:1px solid transparent; background:transparent; color:var(--ink-muted); padding:10px 12px; border-radius:var(--r-sm); font-size:13.5px; font-weight:600; display:flex; align-items:center; gap:10px; width:100%; text-align:left; font-family:'Manrope'; }
  .nav-item:hover{ background:var(--surface-2); color:var(--ink); }
  .nav-item.active{ background:var(--accent-soft); color:var(--accent); }
  .nav-item .nav-label{ flex:1; }
  .nav-item .badge{ font-family:'JetBrains Mono'; font-size:10.5px; color:var(--ink-faint); }
  .nav-item.active .badge{ color:var(--accent); }
  .nav-more-btn{ display:none; }
  .nav-more-sheet, .nav-more-backdrop{ display:none; }

  .topbar{ display:flex; align-items:flex-end; justify-content:space-between; gap:20px; padding-bottom:22px; margin-bottom:24px; border-bottom:1px solid var(--border); }
  .brand-eyebrow{ font-family:'JetBrains Mono'; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:600; margin-bottom:7px; display:flex; align-items:center; gap:6px; }
  h1{ margin:0; font-size:30px; font-weight:700; letter-spacing:-.01em; text-wrap:balance; }
  .sub{ color:var(--ink-muted); font-size:14px; margin-top:5px; max-width:54ch; line-height:1.5; }
  .top-actions{ display:flex; gap:10px; flex-shrink:0; }

  button{ font-family:inherit; cursor:pointer; }
  .btn{ appearance:none; border:1px solid var(--border); background:var(--surface); color:var(--ink); padding:10px 16px; border-radius:var(--r-pill); font-size:13px; font-weight:600; display:inline-flex; align-items:center; gap:7px; transition:border-color .12s, background .12s, transform .08s; }
  .btn:hover{ border-color:var(--ink-faint); }
  .btn:active{ transform:scale(.97); }
  .btn:disabled{ opacity:.5; cursor:default; transform:none; }
  .btn-accent{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .btn-accent:hover{ filter:brightness(1.05); border-color:var(--accent); }
  .btn-ghost{ background:transparent; border-color:transparent; color:var(--ink-muted); padding:7px 9px; border-radius:var(--r-sm); }
  .btn-ghost:hover{ background:var(--surface-2); color:var(--ink); border-color:transparent; }
  .btn-icon{ width:32px; height:32px; padding:0; justify-content:center; border-radius:var(--r-pill); }
  .btn-sm{ padding:7px 12px; font-size:12.5px; }

  .layout{ display:grid; grid-template-columns:230px 1fr; gap:26px; align-items:start; }
  @media (max-width: 820px){ .layout{ grid-template-columns:1fr; } .sidebar{ order:2; } }

  .sidebar{ position:sticky; top:20px; display:flex; flex-direction:column; gap:22px; }
  .search-box{ position:relative; }
  .search-box svg{ position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--ink-faint); width:14px; height:14px; pointer-events:none; }
  .search-box input{ width:100%; padding:10px 12px 10px 34px; border:1px solid var(--border); background:var(--surface); color:var(--ink); border-radius:var(--r-pill); font-size:13.5px; font-family:'Manrope'; outline:none; min-height:40px; }
  .search-box input:focus{ border-color:var(--accent); }
  .search-box .search-clear{ position:absolute; right:6px; top:50%; transform:translateY(-50%); background:transparent; border:none; color:var(--ink-faint); width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
  .search-box .search-clear:hover{ background:var(--surface-2); color:var(--ink); }
  .chip-stale{ color:var(--accent); background:var(--accent-soft); }
  .filter-group h3{ font-family:'JetBrains Mono'; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint); margin:0 0 10px; font-weight:600; }
  .filter-list{ display:flex; flex-direction:column; gap:3px; }
  .filter-item{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 12px; border-radius:var(--r-pill); font-size:13.5px; color:var(--ink-muted); border:1px solid transparent; text-align:left; background:transparent; width:100%; font-family:'Manrope'; }
  .filter-item:hover{ background:var(--surface-2); color:var(--ink); }
  .filter-item.active{ background:var(--surface); border-color:var(--border); color:var(--ink); font-weight:700; box-shadow:var(--shadow); }
  .filter-item .count{ font-family:'JetBrains Mono'; font-size:11px; color:var(--ink-faint); }
  .filter-item.active .count{ color:var(--accent); }
  .dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; display:inline-block; margin-right:8px; }

  .info-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md); padding:16px; box-shadow:var(--shadow); }
  .info-card h3{ margin:0 0 6px; font-size:13.5px; display:flex; align-items:center; gap:6px; }
  .info-card p{ margin:0; font-size:12.5px; color:var(--ink-muted); line-height:1.55; }
  .info-card p + p{ margin-top:8px; }

  .main{ min-width:0; }
  .stat-row{ display:grid; grid-template-columns:repeat(3, 1fr); gap:14px; margin-bottom:22px; }
  @media (max-width:640px){ .stat-row{ grid-template-columns:1fr 1fr; } }
  .stat-tile{ border-radius:var(--r-lg); padding:18px 20px; display:flex; flex-direction:column; gap:16px; }
  .stat-lime{ background:var(--accent); color:var(--accent-ink); }
  .stat-warn{ background:var(--warn); color:var(--warn-ink); }
  .stat-ok{ background:var(--ok); color:var(--ok-ink); }
  .stat-badge{ width:36px; height:36px; border-radius:50%; background:rgba(0,0,0,.24); display:flex; align-items:center; justify-content:center; }
  .stat-badge svg{ width:16px; height:16px; stroke:rgba(255,255,255,.92); }
  .stat-num{ font-family:'Sora'; font-size:25px; font-weight:700; font-variant-numeric:tabular-nums; line-height:1; }
  .stat-lbl{ font-size:12.5px; font-weight:600; opacity:.82; margin-top:4px; }
  .addbar{ display:flex; margin-bottom:22px; }
  .addbar .btn{ padding:12px 20px; font-size:14px; }

  .group{ margin-bottom:28px; }
  .group-title{ display:flex; align-items:center; gap:10px; font-family:'JetBrains Mono'; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint); font-weight:600; margin-bottom:10px; }
  .group-title .line{ flex:1; height:1px; background:var(--border); }

  .task-list{ display:flex; flex-direction:column; gap:8px; }
  .task{ display:grid; grid-template-columns:auto 1fr auto; align-items:start; gap:14px; padding:14px 16px; background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md); transition:border-color .12s; }
  .task:hover{ border-color:var(--ink-faint); }
  .task-check{ width:22px; height:22px; border-radius:50%; border:1.5px solid var(--ink-faint); background:var(--surface); display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px; }
  .task-check:hover{ border-color:var(--ok); }
  .task.done{ opacity:.68; }
  .task.done .task-check{ background:var(--ok); border-color:var(--ok); color:var(--ok-ink); }
  .task-check svg{ width:12px; height:12px; display:none; stroke-width:3; }
  .task.done .task-check svg{ display:block; }

  .task-title{ font-size:14.5px; font-weight:600; line-height:1.4; cursor:pointer; }
  .task.done .task-title{ color:var(--ink-faint); text-decoration:line-through; }
  .task-notes{ font-size:12.5px; color:var(--ink-muted); margin-top:4px; line-height:1.5; max-width:62ch; }
  .task-checklist-progress{ font-family:'JetBrains Mono'; font-size:11px; color:var(--ink-muted); }
  .task-meta{ display:flex; gap:6px; margin-top:9px; flex-wrap:wrap; align-items:center; }

  .chip{ font-family:'JetBrains Mono'; font-size:10.5px; font-weight:600; letter-spacing:.02em; padding:4px 10px; border-radius:var(--r-pill); display:inline-flex; align-items:center; gap:5px; white-space:nowrap; }
  .chip svg{ width:11px; height:11px; }
  .chip-project{ background:var(--surface-2); color:var(--ink-muted); border:1px solid var(--border); }
  .chip-lever-sales{ background:var(--accent); color:var(--accent-ink); }
  .chip-lever-ops{ background:var(--warn); color:var(--warn-ink); }
  .chip-lever-scale{ background:var(--ok); color:var(--ok-ink); }
  .chip-due{ color:var(--ink-faint); background:var(--surface-2); }
  .chip-due.overdue{ color:var(--danger); background:var(--danger-soft); }
  .chip-due.today{ color:var(--accent); background:var(--accent-soft); }
  .chip-project{ font-weight:600; }
  .chip-checklist{ background:var(--surface-2); color:var(--ink-muted); border:1px solid var(--border); }

  .task-actions{ display:flex; gap:2px; flex-shrink:0; }

  .empty{ padding:48px 20px; text-align:center; color:var(--ink-muted); font-size:13.5px; border:1.5px dashed rgba(255,255,255,.16); border-radius:var(--r-md); }

  /* ---- modal overlays (shared look) ---- */
  .overlay{ position:fixed; inset:0; background:rgba(20,15,10,.45); display:flex; align-items:flex-start; justify-content:center; padding:8vh 16px; z-index:60; backdrop-filter: blur(2px); }
  .overlay[hidden]{ display:none; }
  .panel{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); max-width:560px; width:100%; box-shadow:0 24px 70px -20px rgba(0,0,0,.45); max-height:80vh; display:flex; flex-direction:column; overflow:hidden; }
  .panel-lg{ max-width:660px; max-height:90vh; }
  .view-chips{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:18px; }
  .view-section{ margin-bottom:20px; }
  .view-section h4{ margin:0 0 9px; font-size:12px; font-weight:700; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.05em; font-family:'JetBrains Mono'; display:flex; align-items:center; gap:6px; }
  .view-desc{ font-size:14px; line-height:1.65; color:var(--ink); white-space:pre-wrap; }
  .view-checklist{ display:flex; flex-direction:column; gap:8px; }
  .view-checklist .task-check{ width:20px; height:20px; }
  .view-cl-row{ display:flex; align-items:center; gap:10px; font-size:13.5px; }
  .view-cl-row.done span{ color:var(--ink-faint); text-decoration:line-through; }
  .view-cl-row.done .task-check{ background:var(--ok); border-color:var(--ok); color:var(--ok-ink); }
  .view-cl-row.done .task-check svg{ display:block; }
  .view-link{ display:flex; align-items:center; gap:8px; font-size:13.5px; color:var(--accent); text-decoration:none; padding:7px 0; }
  .view-link:hover{ text-decoration:underline; }
  .view-empty{ font-size:13px; color:var(--ink-faint); }

  /* ---- task workspace (task essence + persistent chat) ---- */
  .workspace-panel{ max-width:1040px; width:94vw; height:calc(var(--app-vh, 1vh) * 88); max-height:calc(var(--app-vh, 1vh) * 88); }
  .workspace-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:16px 20px; border-bottom:1px solid var(--border); flex-shrink:0; }
  .wh-eyebrow{ font-family:'JetBrains Mono'; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint); display:block; margin-bottom:3px; }
  .workspace-head h2{ margin:0; font-size:17px; max-width:56ch; text-wrap:balance; }
  .wh-actions{ display:flex; gap:8px; align-items:center; flex-shrink:0; }
  .workspace-body{ flex:1; display:grid; grid-template-columns:1fr 1fr; gap:20px; min-height:0; padding:20px; background:var(--surface); }
  @media (max-width:760px){ .workspace-body{ grid-template-columns:1fr; grid-template-rows:auto 1fr; gap:14px; padding:14px; } .ws-col-task{ max-height:34vh; } .ws-chat-back{ display:inline-flex !important; } }
  .ws-col-task{ padding:0 2px 0 0; overflow-y:auto; }
  .ws-col-chat{ display:flex; flex-direction:column; background:var(--term-bg); color:var(--term-ink); min-height:0; border-radius:var(--r-md); overflow:hidden; box-shadow:0 14px 34px -16px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.05); }
  .ws-chat-body{ flex:1; overflow-y:auto; padding:16px; font-family:'JetBrains Mono'; font-size:12.5px; line-height:1.6; display:flex; flex-direction:column; gap:12px; }
  .ws-chat-head{ display:flex; align-items:center; gap:8px; padding:12px 16px; border-bottom:1px solid rgba(255,255,255,.08); font-family:'JetBrains Mono'; font-size:11.5px; color:#c9bda6; flex-shrink:0; }
  /* Кнопка «Назад к задаче» — на телефоне, когда открыта клавиатура и активна переписка
     с ИИ, единственным доступным действием раньше был крестик «Закрыть», который сносит
     всю карточку задачи целиком, а не просто убирает клавиатуру/скроллит назад к задаче.
     Эта кнопка — ненавязчивый способ вернуться к деталям задачи, ничего не закрывая.
     На десктопе она не нужна (обе колонки видны одновременно), поэтому скрыта по умолчанию
     и включается только в мобильном медиа-запросе выше. */
  .ws-chat-back{ display:none; background:transparent; border:1px solid rgba(255,255,255,.14); color:#c9bda6; width:26px; height:26px; border-radius:7px; align-items:center; justify-content:center; flex-shrink:0; cursor:pointer; }
  .ws-chat-back svg{ width:14px; height:14px; }
  .ws-chat-back:active{ background:rgba(255,255,255,.08); }
  .ws-chat-head .dots{ display:flex; gap:6px; }
  .ws-chat-head .dots span{ width:8px; height:8px; border-radius:50%; display:inline-block; }
  .ws-chat-head .dots span:nth-child(1){ background:#e2685a; }
  .ws-chat-head .dots span:nth-child(2){ background:#e0a53f; }
  .ws-chat-head .dots span:nth-child(3){ background:#5cbf90; }
  .ws-chat-foot{ border-top:1px solid rgba(255,255,255,.08); padding:10px 12px; display:flex; gap:8px; align-items:flex-end; flex-shrink:0; }
  .ws-chat-foot textarea{ flex:1; background:transparent; border:none; outline:none; color:#f2e9db; font-family:'JetBrains Mono'; font-size:12.5px; resize:none; max-height:90px; padding:8px; }
  .ws-chat-foot .btn{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .ws-kickoff{ display:flex; flex-direction:column; align-items:flex-start; gap:12px; padding:8px 0; }
  .ws-kickoff p{ color:#8f8672; font-size:12.5px; line-height:1.7; margin:0; max-width:44ch; }
  .ws-kickoff .btn{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .ws-loading{ color:#8f8672; font-size:12.5px; font-style:italic; }
  .panel-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:18px 20px; border-bottom:1px solid var(--border); }
  .panel-head h2{ margin:0; font-size:16px; display:flex; align-items:center; gap:8px; }
  .panel-head p{ margin:3px 0 0; font-size:12.5px; color:var(--ink-muted); }
  .panel-body{ padding:18px 20px; overflow-y:auto; font-size:13.5px; line-height:1.65; }
  #panelBody{ white-space:pre-wrap; }
  .panel-body.thinking{ color:var(--ink-faint); font-style:italic; }
  .panel-foot{ padding:14px 20px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:8px; }

  /* ---- task editor form: sized for a thumb, not a mouse ---- */
  .field{ margin-bottom:20px; }
  .field label{ display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.05em; margin-bottom:9px; font-family:'JetBrains Mono'; }
  .field input[type=text], .field textarea, .field input[type=date], .field input[type=time]{
    width:100%; border:1px solid var(--border); background:var(--bg); color:var(--ink); border-radius:var(--r-sm);
    padding:13px 14px; font-size:16px; font-family:'Manrope'; outline:none; min-height:48px;
  }
  .field input:focus, .field textarea:focus, .field select:focus{ border-color:var(--accent); }
  .field textarea{ resize:vertical; min-height:130px; line-height:1.5; }
  .field-hint{ font-size:12px; color:var(--ink-faint); margin-top:8px; line-height:1.5; }

  .link-row, .file-row{ display:flex; align-items:center; gap:9px; margin-bottom:9px; }
  .link-row input[type=text]{ padding:12px 13px; font-size:15.5px; border:1px solid var(--border); border-radius:var(--r-sm); background:var(--bg); color:var(--ink); min-height:46px; min-width:0; }
  .link-row .lbl{ flex:0 0 38%; }
  .link-row .url{ flex:1; }
  .file-row{ padding:11px 13px; border:1px solid var(--border); border-radius:var(--r-sm); background:var(--bg); }
  .file-row .fi-icon{ color:var(--ink-muted); flex-shrink:0; }

  // Достаём читаемый текст из data: URL файла — используется и просмотрщиком файлов,

  function decodeDataUrlText(dataUrl){
    var comma = dataUrl.indexOf(',');
    if(comma===-1) return '';

    if(!/;base64/i.test(meta)){ try{ return decodeURIComponent(body); }catch(e){ return body; } }
    try{ return decodeURIComponent(escape(atob(body))); }

  function todayISO(){ return new Date().toISOString().slice(0,10); }

    if(days <= 7) return "через " + days + " дн · " + fmtDate(iso);

  async function bootstrapAuth(){
    if(window.Telegram && window.Telegram.WebApp){
      try{ window.Telegram.WebApp.ready(); window.Telegram.WebApp.expand(); }catch(e){}
    }
    var initData = (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData) || '';
    if(!initData){
      showFatalError('Открой это приложение через Telegram-бота.');
      return false;
    }
    try{
      var res = await fetch('/auth/telegram', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ initData: initData })
      });
      if(!res.ok) throw new Error('HTTP ' + res.status);
      var data = await res.json();
      if(!data || !data.token) throw new Error('нет токена в ответе сервера');
      AUTH_TOKEN = data.token;
      return true;
    }catch(e){
      console.warn('auth error', e);
      showFatalError('Не удалось войти через Telegram. Перезапустите бота и попробуйте снова.');
      return false;
    }
  }

  // Same-origin fetch helper: attaches the bearer token, JSON-encodes bodies, throws on non-2xx.
  // Callers already show a toast on failure (saveTask/patchTask/removeTask/saveRecord/… all
  // .catch(...) into showToast), so this stays a thin wrapper rather than toasting itself.
  function apiFetch(path, opts){
    opts = opts || {};
    var headers = {};
    if(AUTH_TOKEN) headers['Authorization'] = 'Bearer ' + AUTH_TOKEN;
    var body = opts.body;
    if(body !== undefined && body !== null){
      headers['Content-Type'] = 'application/json';
      body = JSON.stringify(body);
    }
    return fetch(path, { method: opts.method || 'GET', headers: headers, body: body, signal: opts.signal })
      .then(function(res){
        if(!res.ok){
          return res.text().catch(function(){ return ''; }).then(function(t){
            var err = new Error('HTTP ' + res.status + (t ? (': ' + t) : ''));
            err.status = res.status;
            throw err;
          });
        }
        if(res.status === 204) return null;
        return res.json().catch(function(){ return null; });
      });
  }

  /* ---- task shape adapter: backend Task row (uppercase enums, dueDate/description/extra)
     <-> local task shape used throughout this file (lowercase project/lever, due/notes,
     dueTime/reminder/links/attachments as top-level fields). ---- */
  function apiProjectToLocal(p){ return p ? String(p).toLowerCase() : 'other'; }
  function localProjectToApi(p){ return (p || 'other').toUpperCase(); }
  function apiLeverToLocal(l){ return l ? String(l).toLowerCase() : 'ops'; }
  function localLeverToApi(l){ return (l || 'ops').toUpperCase(); }
  function apiStatusToLocal(s){ return s === 'DONE' ? 'done' : 'open'; }
  function localStatusToApi(s){ return s === 'done' ? 'DONE' : 'NEW'; }

  function taskFromApi(row){
    var extra = row.extra || {};
    return {
      id: row.id,
      title: row.title || '',
      notes: row.description || '',
      project: apiProjectToLocal(row.project),
      lever: apiLeverToLocal(row.lever),
      status: apiStatusToLocal(row.status),
      due: row.dueDate ? String(row.dueDate).slice(0,10) : null,
      dueTime: extra.dueTime || '',
      reminder: !!extra.reminder,
      links: Array.isArray(extra.links) ? extra.links : [],
      attachments: Array.isArray(extra.attachments) ? extra.attachments : [],
      checklist: Array.isArray(row.checklist) ? row.checklist : [],
      createdByAgentKey: row.createdByAgentKey || null,
      createdAt: row.createdAt ? new Date(row.createdAt).getTime() : Date.now(),
      updatedAt: row.updatedAt ? new Date(row.updatedAt).getTime() : undefined,
      extra: extra // raw extra kept around so task.extra.chat can hold per-task chat history
    };
  }
  function taskToApiBody(task){
    return {

      title: task.title || '',
      description: task.notes || '',
      project: localProjectToApi(task.project),
      lever: localLeverToApi(task.lever),
      status: localStatusToApi(task.status),
      dueDate: task.due || null,
      checklist: task.checklist || [],
      createdByAgentKey: task.createdByAgentKey || undefined,
      extraPatch: {
        dueTime: task.dueTime || '',
        reminder: !!task.reminder,
        links: task.links || [],
        attachments: task.attachments || []
      }
    };
  }
  function taskPatchToApiBody(patch){
    var body = {};
    if('title' in patch) body.title = patch.title;
    if('notes' in patch) body.description = patch.notes;
    if('project' in patch) body.project = localProjectToApi(patch.project);
    if('lever' in patch) body.lever = localLeverToApi(patch.lever);
    if('status' in patch) body.status = localStatusToApi(patch.status);
    if('due' in patch) body.dueDate = patch.due;
    if('checklist' in patch) body.checklist = patch.checklist;
    if('createdByAgentKey' in patch) body.createdByAgentKey = patch.createdByAgentKey;
    var extraPatch = {}, hasExtra = false;
    ['dueTime','reminder','links','attachments'].forEach(function(k){ if(k in patch){ extraPatch[k] = patch[k]; hasExtra = true; } });
    if(patch.extraPatch){ Object.assign(extraPatch, patch.extraPatch); hasExtra = true; }
    if(hasExtra) body.extraPatch = extraPatch;
    return body;
  }

  // Shim exposing the same .doc(id).set/update/delete surface the old Firestore-like `db`
  // capability gave saveTask/patchTask/removeTask, backed by real REST calls. No realtime
  // listeners any more (single tab, no external writers), so each call also folds the
  // server's canonical response back into local state and re-renders.
  function makeTasksCol(){
    return {
      doc: function(id){
        return {
          set: function(task){
            return apiFetch('/tasks', { method:'POST', body: taskToApiBody(task) }).then(function(res){
              if(res && res.task){ state.tasks[id] = taskFromApi(res.task); render(); }
            });
          },
          update: function(patch){
            return apiFetch('/tasks/' + id, { method:'PATCH', body: taskPatchToApiBody(patch) }).then(function(res){
              if(res && res.task){ state.tasks[id] = taskFromApi(res.task); render(); }
            });
          },
          delete: function(){
            return apiFetch('/tasks/' + id, { method:'DELETE' });
          }
        };
      }
    };
  }
  function makeRecordCol(moduleKey){
    return {
      doc: function(id){
        return {
          set: function(rec){
            return apiFetch('/records/' + moduleKey, { method:'POST', body: rec }).then(function(res){
              if(res && res.record){ state.records[moduleKey][id] = res.record; render(); }
            });
          },
          update: function(patch){
            return apiFetch('/records/' + moduleKey + '/' + id, { method:'PATCH', body: patch }).then(function(res){
              if(res && res.record){ state.records[moduleKey][id] = res.record; render(); }
            });
          },
          delete: function(){
            return apiFetch('/records/' + moduleKey + '/' + id, { method:'DELETE' });
          }
        };
      }
    };
  }

  async function initApp(){
    var ok = await bootstrapAuth();
    if(!ok) return;

    tasksCol = makeTasksCol();
    Object.keys(MODULE_DEFS).forEach(function(mk){ recordCols[mk] = makeRecordCol(mk); });

    try{
      var tres = await apiFetch('/tasks');
      var freshTasks = {};
      (tres && tres.tasks || []).forEach(function(row){ var t = taskFromApi(row); freshTasks[t.id] = t; });
      state.tasks = freshTasks;
    }catch(e){ console.warn('load tasks failed', e); showToast('Не удалось загрузить задачи — обновите страницу.', true); }

    await Promise.all(Object.keys(MODULE_DEFS).map(function(mk){
      return apiFetch('/records/' + mk).then(function(rres){
        var fresh = {};
        (rres && rres.records || []).forEach(function(r){ fresh[r.id] = r; });
        state.records[mk] = fresh;
      }).catch(function(e){ console.warn('load records failed (' + mk + ')', e); });
    }));

    render();
  }

  function saveFailMsg(e){
    var msg = (e && e.message) || '';
    if(/too large|size|256|exceed/i.test(msg)) return 'Задача не сохранилась — превышен лимит размера (слишком много/тяжёлые файлы). Уберите файл или дайте ссылку вместо него.';
    return 'Не удалось сохранить изменения — проверьте связь и попробуйте ещё раз.';
  }
  function saveTask(task){
    state.tasks[task.id] = task; render();
    if(tasksCol){ tasksCol.doc(task.id).set(task).catch(function(e){ console.warn('save failed', e); showToast(saveFailMsg(e), true); }); }
    return task;
  }
  function patchTask(id, patch){
    var t = state.tasks[id]; if(!t) return null;
    var updated = Object.assign({}, t, patch, { updatedAt: Date.now() });
    state.tasks[id] = updated; render();
    if(tasksCol){
      tasksCol.doc(id).update(patch).catch(function(){
        tasksCol.doc(id).set(updated).catch(function(e){ console.warn('save failed', e); showToast(saveFailMsg(e), true); });
      });
    }
    return updated;
  }
  function removeTask(id){
    var t = state.tasks[id]; if(!t) return;
    delete state.tasks[id]; render();
    if(tasksCol){ tasksCol.doc(id).delete().catch(function(){ showToast('Не удалось удалить задачу — попробуйте ещё раз.', true); }); }
    showActionToast('Задача «' + t.title + '» удалена', 'Отменить', function(){
      state.tasks[id] = t; render();
      if(tasksCol){ tasksCol.doc(id).set(t).catch(function(e){ showToast(saveFailMsg(e), true); }); }
    });
  }

  /* ---- generic CRUD for the module records (sales/production/warehouse/finance/documents/regulations) ---- */
  function saveRecord(moduleKey, rec){
    state.records[moduleKey][rec.id] = rec; render();
    var col = recordCols[moduleKey];
    if(col){ col.doc(rec.id).set(rec).catch(function(e){ console.warn('save failed', e); showToast(saveFailMsg(e), true); }); }
    return rec;
  }
  function patchRecord(moduleKey, id, patch){
    var r = state.records[moduleKey][id]; if(!r) return null;
    var extra = { updatedAt: Date.now() };
    if(patch.stage !== undefined) extra.stageAt = Date.now();
    var updated = Object.assign({}, r, patch, extra);
    state.records[moduleKey][id] = updated; render();
    var col = recordCols[moduleKey];
    if(col){
      col.doc(id).update(Object.assign({}, patch, extra)).catch(function(){
        col.doc(id).set(updated).catch(function(e){ console.warn('save failed', e); showToast(saveFailMsg(e), true); });
      });
    }
    return updated;
  }
  function kanbanMove(moduleKey, id, dir){
    var kd = KANBAN_DEFS[moduleKey]; var r = state.records[moduleKey][id]; if(!kd || !r) return;
    var idx = kd.order.indexOf(r.stage || kd.order[0]);
    var next = idx + dir;
    if(next < 0 || next >= kd.order.length) return;
    patchRecord(moduleKey, id, { stage: kd.order[next] });
    showToast('Перемещено: ' + kd.map[kd.order[next]].label);
  }
  function removeRecord(moduleKey, id){
    var r = state.records[moduleKey][id]; if(!r) return;
    delete state.records[moduleKey][id]; render();
    var col = recordCols[moduleKey];
    if(col){ col.doc(id).delete().catch(function(){ showToast('Не удалось удалить запись — попробуйте ещё раз.', true); }); }
    showActionToast('Запись удалена', 'Отменить', function(){
      state.records[moduleKey][id] = r; render();
      if(col){ col.doc(id).set(r).catch(function(e){ showToast(saveFailMsg(e), true); }); }
    });
  }
  function recordsArr(moduleKey){ var o = state.records[moduleKey]||{}; return Object.keys(o).map(function(k){ return o[k]; }); }
  function fmtMoney(n){ n = Number(n)||0; return n.toLocaleString('ru-RU') + ' ₽'; }

  function allTasksArr(){ return Object.keys(state.tasks).map(function(k){ return state.tasks[k]; }); }
  function counts(){
    var c = { all:0, metalizm:0, printbar:0, sprintami:0, other:0 };
    allTasksArr().forEach(function(t){ if(t.status==='done') return; c.all++; c[t.project]=(c[t.project]||0)+1; });
    return c;
  }
  function headlineStats(){
    var t = todayISO(), burning = 0, doneWeek = 0, open = 0, weekAgo = Date.now() - 7*86400000;
    allTasksArr().forEach(function(x){
      if(x.status==='done'){ if((x.updatedAt||x.createdAt||0) >= weekAgo) doneWeek++; return; }
      open++;
      if(x.due && x.due <= t) burning++;
    });
    return { open: open, burning: burning, doneWeek: doneWeek };
  }
  function staleDays(t){
    if(t.due || t.status==='done' || !t.createdAt) return 0;
    return Math.floor((Date.now() - t.createdAt) / 86400000);
  }
  function filtered(){
    var q = state.search.trim().toLowerCase();
    return allTasksArr().filter(function(t){
      if(!state.showDone && t.status==='done') return false;
      if(state.projectFilter!=='all' && t.project!==state.projectFilter) return false;
      if(state.leverFilter!=='all' && t.lever!==state.leverFilter) return false;
      if(q && (t.title||'').toLowerCase().indexOf(q)===-1 && (t.notes||'').toLowerCase().indexOf(q)===-1) return false;
      return true;
    });
  }
  function groupTasks(list){
    var groups = { overdue:[], today:[], week:[], later:[], none:[], done:[] };
    var t = todayISO();
    list.forEach(function(task){
      if(task.status === 'done'){ groups.done.push(task); return; }
      if(!task.due){ groups.none.push(task); return; }
      if(task.due < t) groups.overdue.push(task);
      else if(task.due === t) groups.today.push(task);
      else { var days = Math.round((new Date(task.due+"T00:00:00") - new Date(t+"T00:00:00"))/86400000); if(days<=7) groups.week.push(task); else groups.later.push(task); }
    });
    Object.keys(groups).forEach(function(k){ groups[k].sort(function(a,b){ return (a.due||'9999').localeCompare(b.due||'9999'); }); });
    return groups;
  }

  function renderKanbanBody(moduleKey){
    var def = MODULE_DEFS[moduleKey];
    var kd = KANBAN_DEFS[moduleKey];
    var list = recordsArr(moduleKey);
    var lastStage = kd.order[kd.order.length-1];
    var totalAmount = moduleKey==='sales' ? list.filter(function(r){return r.stage!==lastStage;}).reduce(function(s,r){return s+(Number(r.amount)||0);},0) : null;
    var doneCount = list.filter(function(r){ return r.stage===lastStage; }).length;
    var burning = list.filter(function(r){ return r.due && r.due<=todayISO() && r.stage!==lastStage; }).length;
    var tiles = moduleKey==='sales'
      ? [ ['trending-up', fmtMoney(totalAmount), 'В воронке (не сдано в цех)', 'stat-lime'], ['alert-triangle', burning, 'Горит по сроку', 'stat-warn'], ['check-circle', doneCount, 'Передано в цех', 'stat-ok'] ]
      : [ ['settings', list.length-doneCount, 'В производстве', 'stat-lime'], ['alert-triangle', burning, 'Горит по сроку', 'stat-warn'], ['check-circle', doneCount, 'Передано клиенту', 'stat-ok'] ];

    var cols = kd.order.map(function(stageKey, idx){
      var items = list.filter(function(r){ return (r.stage||kd.order[0])===stageKey; })
        .sort(function(a,b){ return (a.due||'9999').localeCompare(b.due||'9999'); });
      return '<div class="kanban-col">' +

  /* ---- ABC-анализ направлений по финансовой прибыли ---- */
  function computeDirectionsABC(){
    var finance = recordsArr('finance');
    var keys = Object.keys(PROJECTS).filter(function(k){
      if(k==='other') return finance.some(function(r){ return r.project==='other'; });
      return true;
    });
    var rows = keys.map(function(k){
      var inc = finance.filter(function(r){ return r.project===k && r.type==='income'; }).reduce(function(s,r){ return s+(Number(r.amount)||0); },0);
      var exp = finance.filter(function(r){ return r.project===k && r.type==='expense'; }).reduce(function(s,r){ return s+(Number(r.amount)||0); },0);
      return { key:k, label:PROJECTS[k].short, income:inc, expense:exp, net:inc-exp };
    });
    var totalPositive = rows.filter(function(r){ return r.net>0; }).reduce(function(s,r){ return s+r.net; },0) || 1;
    rows.sort(function(a,b){ return b.net-a.net; });
    var cum = 0;
    rows.forEach(function(r){
      if(r.net>0){ cum += r.net; r.share = r.net/totalPositive; r.cumShare = cum/totalPositive; r.cls = r.cumShare<=0.8?'A':(r.cumShare<=0.95?'B':'C'); }
      else { r.share = 0; r.cls = null; }
    });
    return rows;
  }

  /* ---- сильные / слабые стороны для дашборда ---- */
  function computeInsights(){
    var hs = headlineStats();
    var sales = recordsArr('sales'), production = recordsArr('production');
    var dirs = computeDirectionsABC();
    var strengths = [], weaknesses = [];

    var leader = dirs.filter(function(d){ return d.cls==='A'; })[0];
    if(leader) strengths.push(leader.label + ' — направление-лидер по прибыли (класс A, '+Math.round(leader.share*100)+'% от общей).');
    var lossy = dirs.filter(function(d){ return d.net<0; });
    lossy.forEach(function(d){ weaknesses.push(d.label + ' сейчас в минус: ' + fmtMoney(d.net) + '.'); });

    var overdueSales = sales.filter(function(r){ return r.due && r.due<todayISO() && r.stage!=='to_production'; });
    if(overdueSales.length) weaknesses.push(overdueSales.length + ' заявок в продажах просрочены по сроку.');
    else if(sales.length) strengths.push('Просроченных заявок в продажах нет.');

    var overdueProd = production.filter(function(r){ return r.due && r.due<todayISO() && r.stage!=='delivered'; });
    if(overdueProd.length) weaknesses.push(overdueProd.length + ' заказов в производстве горят по сроку.');

    var stuckSales = sales.filter(function(r){ return r.stage!=='to_production' && r.stageAt && (Date.now()-r.stageAt) > 7*86400000; });
    if(stuckSales.length) weaknesses.push(stuckSales.length + ' заявок висят на одном этапе больше недели без движения.');

    if(hs.burning===0) strengths.push('Нет горящих задач на сегодня.');
    else weaknesses.push(hs.burning + ' ' + (hs.burning===1?'задача горит':'задач горят') + ' сегодня.');

    if(hs.doneWeek>0) strengths.push('Выполнено ' + hs.doneWeek + ' ' + (hs.doneWeek===1?'задача':'задач') + ' за последние 7 дней.');

    if(!strengths.length) strengths.push('Пока рано делать выводы — маловато данных.');
    if(!weaknesses.length) weaknesses.push('Слабых мест не видно — так держать.');
    return { strengths:strengths, weaknesses:weaknesses };
  }

  /* ============ chatGptSample: replaces window.claude.use('sample') ============
     Same call contract as the old capability so every call site (askAboutTask, runDigest,
     sendWorkspaceMessage, sendChat, workspaceTools/chatTaskTools defs) needs zero changes:
       sample(turnsOrPrompt, opts) -> Promise<{text, truncated}>
       turnsOrPrompt: a prompt string, or an array of {role:'user'|'assistant'|'system', content}
       opts: { signal, onText(u) [u.text], tools?: [{name, description, inputSchema, execute}], cache? }
     Talks to POST /chat, which does ONE step at a time (either {text} or {tool_calls}) — this
     function runs the loop: on tool_calls, it executes each tool's own (synchronous) .execute()
     locally — same execute() functions as before, already mutating state/persisting via
     saveTask/patchTask/etc. — appends the assistant tool_calls turn + one tool-result turn per
     call, and posts /chat again, until a final {text} comes back. ============ */
  async function chatGptSample(turnsOrPrompt, opts){
    opts = opts || {};
    var messages = typeof turnsOrPrompt === 'string'
      ? [{ role:'user', content: turnsOrPrompt }]
      : turnsOrPrompt.map(function(m){ return { role: (m.role==='assistant'?'assistant':(m.role==='system'?'system':'user')), content: m.content }; });

    var toolDefs = opts.tools ? (typeof opts.tools === 'function' ? opts.tools() : opts.tools) : null;
    var toolsByName = {}, openaiTools = null;
    if(toolDefs && toolDefs.length){
      openaiTools = toolDefs.map(function(t){
        toolsByName[t.name] = t;
        return { type:'function', function:{ name:t.name, description:t.description, parameters:t.inputSchema } };
      });
    }

    var maxSteps = 8;
    for(var step = 0; step < maxSteps; step++){
      var body = { messages: messages };
      if(openaiTools) body.tools = openaiTools;

      var res;
      try{
        res = await apiFetch('/chat', { method:'POST', body: body, signal: opts.signal });
      }catch(e){
        if(e && (e.name === 'AbortError' || (opts.signal && opts.signal.aborted))){
          var cancelErr = new Error('cancelled'); cancelErr.code = 'cancelled'; cancelErr.text = ''; throw cancelErr;
        }
        var upErr = new Error((e && e.message) || 'upstream error'); upErr.code = 'upstream_error'; throw upErr;
      }

      if(res && res.tool_calls && res.tool_calls.length){
        messages.push({ role:'assistant', content:null, tool_calls: res.tool_calls.map(function(tc){
          return { id: tc.id, type:'function', function:{ name: tc.name, arguments: tc.arguments } };
        }) });
        for(var i=0; i<res.tool_calls.length; i++){
          var tc = res.tool_calls[i];
          var tool = toolsByName[tc.name];
          var result;
          try{
            var args = {}; try{ args = tc.arguments ? JSON.parse(tc.arguments) : {}; }catch(pe){ args = {}; }
            // await работает и для обычного синхронного execute() (просто резолвится сразу),
            // и для нового generate_image, чей execute() ходит на бэкенд за картинкой и
            // возвращает промис — без await он бы улетел в JSON.stringify как пустой объект.
            result = tool ? await tool.execute(args) : { error: 'unknown tool: ' + tc.name };
          }catch(execErr){
            result = { error: (execErr && execErr.message) || String(execErr) };
          }
          messages.push({ role:'tool', tool_call_id: tc.id, content: JSON.stringify(result === undefined ? null : result) });
        }
        continue;
      }

      var text = (res && res.text) || '';
      if(opts.onText){ try{ opts.onText({ text:text }); }catch(e2){} }
      return { text: text, truncated: false };
    }
    var loopErr = new Error('too many tool-call steps'); loopErr.code = 'upstream_error'; throw loopErr;
  }
  var sample = chatGptSample;

  /* ============ shared chat plumbing: every chat surface (main drawer, dashboard, task
     workspace) sends through this one function — same sample() call shape,
     same pending/streaming/error handling, same cancel-on-resend behaviour. ============ */
  function runChatSend(turns, text, opts){
    if(!text) return;
    if(!sample){
      turns.push({ role:'user', content:text });
      turns.push({ role:'system', content: opts.disabledMsg || 'Чат с Клодом недоступен в этом просмотре.', _ephemeral: !!opts.disabledEphemeral });
      opts.render();
      return;
    }
    turns.push({ role:'user', content:text });
    opts.render();

    var instructions = typeof opts.instructions === 'function' ? opts.instructions() : opts.instructions;
    var turnsForCall = [{ role:'user', content: instructions }].concat(
      turns.filter(function(m){ return !m._ephemeral; }).map(function(m){ return { role: m.role==='assistant'?'assistant':'user', content: m.content }; })
    );

    turns.push({ role:'assistant', content:'…', _pending:true });
    opts.render();

    var prevCtl = opts.getCtl(); if(prevCtl) prevCtl.abort();
    var ctl = new AbortController(); opts.setCtl(ctl);

    var sampleOpts = { signal: ctl.signal, onText: function(u){
      var last = turns[turns.length-1];
      if(last && last._pending){ last.content = u.text; opts.render(); }
    } };
    if(opts.tools) sampleOpts.tools = typeof opts.tools === 'function' ? opts.tools() : opts.tools;
    if(opts.cache !== undefined) sampleOpts.cache = opts.cache;

    return sample(turnsForCall, sampleOpts).then(function(res){
      var lastMsg = turns[turns.length-1];
      if(lastMsg && lastMsg._pending){ lastMsg.content = res.text; delete lastMsg._pending; }
      if(opts.persist) opts.persist();
      opts.render();
    }).catch(function(e){
      var lastErr = turns[turns.length-1];
      if(lastErr && lastErr._pending) turns.pop();
      if(e.code !== 'cancelled'){ turns.push({ role:'system', content: errCopy(e) }); }
      if(opts.persist) opts.persist();
      opts.render();
    });
  }

  // The whole task document (title+notes+checklist+links+attachments) is capped at 256 KiB
  // by the store. Attachments are stored as base64 data URLs, which run ~33% BIGGER than the
  // original bytes — so every budget below is the real stored-string size, not the file size,
  // and the total stays well under the document cap to leave room for everything else in it.
  var MAX_FILE_BYTES = 50000, MAX_FILES = 3, MAX_TOTAL_BYTES = 150000, NON_IMAGE_RAW_PRECHECK = 90000;

  function compressImageToDataUrl(file, maxBytes){
    return new Promise(function(resolve, reject){
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function(){
        URL.revokeObjectURL(url);
        function attempt(dim, quality){
          var scale = Math.min(1, dim / Math.max(img.naturalWidth, img.naturalHeight));
          var w = Math.max(1, Math.round(img.naturalWidth * scale)), h = Math.max(1, Math.round(img.naturalHeight * scale));
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          var dataUrl = canvas.toDataURL('image/jpeg', quality);
          return { dataUrl: dataUrl, size: dataUrl.length }; // size = actual stored bytes (the base64 string), not decoded image bytes
        }
        var stages = [[1280,0.78],[1024,0.7],[800,0.62],[640,0.55],[480,0.45],[360,0.35]];
        var i = 0;
        (function tryNext(){
          var s = stages[Math.min(i, stages.length-1)];
          var res = attempt(s[0], s[1]);
          i++;
          if(res.size <= maxBytes || i >= stages.length) resolve(res);
          else tryNext();
        })();
      };
      img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error('image_load_failed')); };
      img.src = url;
    });
  }

  document.getElementById('tf-file-pick').addEventListener('click', function(){ tfFileInput.click(); });
  tfFileInput.addEventListener('change', function(){
    var files = Array.prototype.slice.call(tfFileInput.files || []);
    (function next(idx){
      if(idx >= files.length) return;
      var file = files[idx];
      if(editingAttachments.length >= MAX_FILES){
        tfFileHint.textContent = 'Достигнут лимит в ' + MAX_FILES + ' файла — остальное не добавлено.';
        tfFileHint.style.color = 'var(--danger)';
        return;
      }
      var used = editingAttachments.reduce(function(s,f){ return s+f.size; }, 0);
      var isImg = file.type && file.type.indexOf('image/') === 0;
      if(isImg){
        tfFileHint.style.color = '';
        tfFileHint.textContent = 'Сжимаю «' + file.name + '»…';
        compressImageToDataUrl(file, Math.max(20000, Math.min(MAX_FILE_BYTES, MAX_TOTAL_BYTES - used))).then(function(res){
          if(used + res.size > MAX_TOTAL_BYTES){
            tfFileHint.textContent = 'Суммарный лимит файлов на задачу исчерпан — удалите файл или дайте ссылку вместо ещё одного фото.';
            tfFileHint.style.color = 'var(--danger)';
            next(idx + 1);
            return;
          }
          editingAttachments.push({ id: cuid(), name: file.name.replace(/\.\w+$/, '.jpg'), type: 'image/jpeg', size: res.size, dataUrl: res.dataUrl });
          renderFilesEditor();
          next(idx + 1);
        }).catch(function(){
          tfFileHint.textContent = 'Не получилось обработать «' + file.name + '» — попробуйте другое фото.';
          tfFileHint.style.color = 'var(--danger)';
          next(idx + 1);
        });
        return;
      }
      if(file.size > NON_IMAGE_RAW_PRECHECK){
        tfFileHint.textContent = '«' + file.name + '» весит ' + fmtBytes(file.size) + ' — многовато для файла (лимит ~' + fmtBytes(NON_IMAGE_RAW_PRECHECK) + ' для не-фото). Дайте ссылку вместо файла.';
        tfFileHint.style.color = 'var(--danger)';
        next(idx + 1);
        return;
      }
      var reader = new FileReader();
      reader.onload = function(){
        var storedSize = reader.result.length; // what actually lands in the document — bigger than file.size (base64)
        if(used + storedSize > MAX_TOTAL_BYTES){
          tfFileHint.textContent = 'Суммарный лимит файлов на задачу исчерпан — удалите файл или дайте ссылку.';
          tfFileHint.style.color = 'var(--danger)';
          next(idx + 1);
          return;
        }
        editingAttachments.push({ id: cuid(), name: file.name, type: file.type || 'application/octet-stream', size: storedSize, dataUrl: reader.result });
        tfFileHint.style.color = '';
        renderFilesEditor();
        next(idx + 1);
      };
      reader.onerror = function(){ tfFileHint.textContent = 'Не получилось прочитать «' + file.name + '».'; tfFileHint.style.color = 'var(--danger)'; next(idx + 1); };
      reader.readAsDataURL(file);
    })(0);
    tfFileInput.value = '';
  });

  /* ============ task workspace: essence + persistent per-task chat ============ */
  var viewOverlay = document.getElementById('viewOverlay');
  var wsEyebrow = document.getElementById('wsEyebrow');
  var wsTitle = document.getElementById('wsTitle');
  var wsTaskCol = document.getElementById('wsTaskCol');
  var wsChatBody = document.getElementById('wsChatBody');
  var wsChatInput = document.getElementById('wsChatInput');
  var wsChatSend = document.getElementById('wsChatSend');
  var workspaceOpenId = null;
  var workspaceChat = {};     // taskId -> [{role, content, _ephemeral?}]
  var workspaceLoaded = {};   // taskId -> true once loaded from db
  var wsCtl = null;

  // Per-task chat history lives in task.extra.chat (already loaded with the task via
  // taskFromApi) and is persisted with a plain extraPatch, rather than a Firestore subcollection.
  async function loadWorkspaceChat(taskId){
    if(workspaceLoaded[taskId]) return;
    var t = state.tasks[taskId];
    workspaceChat[taskId] = (t && t.extra && Array.isArray(t.extra.chat)) ? t.extra.chat : [];
    workspaceLoaded[taskId] = true;
  }
  function persistWorkspaceChat(taskId){
    var turns = (workspaceChat[taskId]||[]).filter(function(m){ return !m._ephemeral; }).slice(-40).map(function(m){ return { role:m.role, content:m.content }; });
    var t = state.tasks[taskId];
    if(t){ t.extra = t.extra || {}; t.extra.chat = turns; }
    apiFetch('/tasks/' + taskId, { method:'PATCH', body: { extraPatch: { chat: turns } } }).catch(function(){});
  }

  function openTaskWorkspace(id){
    workspaceOpenId = id;
    viewOverlay.hidden = false;
    renderWorkspaceLeft(id);
    wsChatBody.innerHTML = '<div class="ws-loading">Загружаю историю по задаче…</div>';
    refreshIcons();
    loadWorkspaceChat(id).then(function(){ if(workspaceOpenId===id) renderWorkspaceChat(id); });
    setTimeout(function(){ wsChatInput.focus(); }, 30);
  }
  function closeTaskWorkspace(){ viewOverlay.hidden = true; workspaceOpenId = null; if(wsCtl) wsCtl.abort(); }
  document.getElementById('wsClose').addEventListener('click', closeTaskWorkspace);
  viewOverlay.addEventListener('click', function(e){ if(e.target===viewOverlay) closeTaskWorkspace(); });
  document.getElementById('ws-edit').addEventListener('click', function(){ var id=workspaceOpenId; closeTaskWorkspace(); if(id) openTaskEditor(id); });
  // «Назад к задаче» — убирает клавиатуру и прокручивает к деталям задачи, НЕ закрывая
  // саму карточку. Раньше единственным действием рядом с чатом был крестик «Закрыть»,
  // который по привычке нажимали на автомате — а он сносит всю задачу целиком.
  document.getElementById('wsChatBack').addEventListener('click', function(){
    wsChatInput.blur();
    var col = document.getElementById('wsTaskCol');
    if(col && col.scrollIntoView) col.scrollIntoView({ behavior:'smooth', block:'start' });
    try{ window.scrollTo({ top:0, behavior:'smooth' }); }catch(e){ window.scrollTo(0,0); }
  });

  function renderWorkspaceLeft(id){
    var t = state.tasks[id];
    if(!t){ closeTaskWorkspace(); return; }
    var proj = PROJECTS[t.project] || PROJECTS.other, lev = LEVERS[t.lever] || LEVERS.ops, dc = dueClass(t.due);
    wsEyebrow.textContent = t.status==='done' ? 'Выполнено' : 'Открыта задача';
    wsTitle.textContent = t.title;

    var chips = '<div class="view-chips">' +
      '<span class="chip chip-project">'+esc(proj.short)+'</span>' +
      '<span class="chip '+lev.cls+'">'+esc(lev.label)+'</span>' +
      '<span class="chip chip-due '+dc+'"><i data-feather="'+(t.reminder?'bell':'calendar')+'"></i>'+esc(dueLabel(t))+'</span>' +
    '</div>';

    var descSection = '<div class="view-section"><h4><i data-feather="align-left"></i> Описание</h4>' +
      (t.notes ? '<div class="view-desc">'+esc(t.notes)+'</div>' : '<div class="view-empty">Без описания — Клод дополнит по ходу разговора.</div>') + '</div>';

    var clSection = '<div class="view-section"><h4><i data-feather="check-square"></i> Чек-лист'+(checklistProgress(t)?(' — '+checklistProgress(t)):'')+'</h4>';
    if(t.checklist && t.checklist.length){
      clSection += '<div class="view-checklist">' + t.checklist.map(function(c){
        return '<div class="view-cl-row '+(c.done?'done':'')+'">' +
          '<button type="button" class="task-check" data-vcl-toggle="'+c.id+'"><i data-feather="check"></i></button>' +
          '<span>'+esc(c.text)+'</span>' +
        '</div>';
      }).join('') + '</div>';
    } else { clSection += '<div class="view-empty">Пунктов пока нет.</div>'; }
    clSection += '</div>';

    var linksSection = '<div class="view-section"><h4><i data-feather="link-2"></i> Ссылки</h4>';
    if(t.links && t.links.length){
      linksSection += t.links.map(function(l){ return '<a class="view-link" href="'+esc(l.url)+'" target="_blank" rel="noopener"><i data-feather="external-link"></i>'+esc(l.label||l.url)+'</a>'; }).join('');
    } else { linksSection += '<div class="view-empty">Ссылок нет.</div>'; }
    linksSection += '</div>';

    var filesSection = '<div class="view-section"><h4><i data-feather="paperclip"></i> Файлы</h4>';
    if(t.attachments && t.attachments.length){
      filesSection += t.attachments.map(function(f){
        var isImg = f.type && f.type.indexOf('image/')===0;
        return '<div class="file-row" data-open-file="'+f.id+'" style="cursor:pointer">' +
          (isImg ? '<img class="fi-thumb" src="'+f.dataUrl+'" />' : '<span class="fi-icon"><i data-feather="file"></i></span>') +
          '<span class="fi-name">'+esc(f.name)+'</span><span class="fi-size">'+fmtBytes(f.size)+'</span>' +
        '</div>';
      }).join('');
    } else { filesSection += '<div class="view-empty">Файлов нет.</div>'; }
    filesSection += '</div>';

    wsTaskCol.innerHTML = chips + descSection + clSection + linksSection + filesSection;
    refreshIcons();

    wsTaskCol.querySelectorAll('[data-vcl-toggle]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var cid = btn.getAttribute('data-vcl-toggle');
        var task = state.tasks[id]; if(!task) return;
        var updatedChecklist = (task.checklist||[]).map(function(c){ return c.id===cid ? Object.assign({},c,{done:!c.done}) : c; });
        patchTask(id, { checklist: updatedChecklist });
        renderWorkspaceLeft(id);
      });
    });
    wsTaskCol.querySelectorAll('[data-open-file]').forEach(function(row){
      row.addEventListener('click', function(){
        var fid = row.getAttribute('data-open-file');
        var task = state.tasks[id]; if(!task) return;
        var f = (task.attachments||[]).filter(function(x){ return x.id===fid; })[0];
        if(f) openFileViewer(f);
      });
    });
  }

  // Просмотр файла ПРЯМО ВНУТРИ приложения — раньше клик открывал data:-ссылку через
  // window.open, а мобильные браузеры и WebView Telegram такие ссылки в новой вкладке
  // почти всегда молча блокируют (файл «не открывается»). Модалка ниже работает без
  // навигации: текстовые форматы показываются как текст, картинки — как картинка.
  var fileViewerOverlay = null, fileViewerBody = null, fileViewerTitle = null;
  function ensureFileViewer(){
    if(fileViewerOverlay) return;
    fileViewerOverlay = document.createElement('div');
    fileViewerOverlay.className = 'overlay';
    fileViewerOverlay.hidden = true;
    fileViewerOverlay.innerHTML =
      '<div class="panel">' +
        '<div class="panel-head"><h2 id="fileViewerTitle"></h2>' +
          '<button type="button" class="btn-ghost btn btn-icon" id="fileViewerClose" aria-label="Закрыть"><i data-feather="x"></i></button>' +
        '</div>' +
        '<div class="panel-body" id="fileViewerBody"></div>' +
      '</div>';
    document.body.appendChild(fileViewerOverlay);
    fileViewerBody = document.getElementById('fileViewerBody');
    fileViewerTitle = document.getElementById('fileViewerTitle');
    document.getElementById('fileViewerClose').addEventListener('click', function(){ fileViewerOverlay.hidden = true; });
    fileViewerOverlay.addEventListener('click', function(e){ if(e.target===fileViewerOverlay) fileViewerOverlay.hidden = true; });
  }
  function openFileViewer(f){
    ensureFileViewer();
    fileViewerTitle.textContent = f.name;
    var isImg = f.type && f.type.indexOf('image/')===0;
    var isText = f.type && /^text\/|json/i.test(f.type);
    if(isImg){
      fileViewerBody.innerHTML = '';
      var img = document.createElement('img');
      img.src = f.dataUrl; img.style.maxWidth = '100%'; img.style.borderRadius = '8px'; img.style.display = 'block';
      fileViewerBody.appendChild(img);
    } else if(isText){
      fileViewerBody.style.whiteSpace = 'pre-wrap';
      fileViewerBody.style.fontFamily = "'JetBrains Mono'";
      fileViewerBody.style.fontSize = '12.5px';
      fileViewerBody.style.lineHeight = '1.6';
      fileViewerBody.textContent = decodeDataUrlText(f.dataUrl) || '(пустой файл)';
    } else {
      fileViewerBody.style.whiteSpace = '';
      fileViewerBody.style.fontFamily = '';
      fileViewerBody.innerHTML = '<p>Этот формат («'+esc(f.type||'неизвестный')+'») нельзя показать прямо здесь — на телефоне открыть его как отдельный файл не получится, только на компьютере через выгрузку данных задачи.</p><p>Размер: '+fmtBytes(f.size)+'.</p>';
    }
    fileViewerOverlay.hidden = false;
    refreshIcons();
  }

  function renderWorkspaceChat(id){
    var turns = workspaceChat[id] || [];
    if(!turns.length){
      wsChatBody.innerHTML = '<div class="ws-kickoff">' +
        '<p>Клод ещё не работал над этой задачей. Он вникнет в контекст слева, предложит, с чего начать, и будет вести разговор с памятью всей истории по именно этой задаче — по ходу дела сам дополняя описание и чек-лист.</p>' +
        '<button class="btn btn-sm" id="wsKickoff"><i data-feather="play"></i> Приступить к выполнению</button>' +
      '</div>';
      refreshIcons();
      var kb = document.getElementById('wsKickoff');
      if(kb) kb.addEventListener('click', function(){ sendWorkspaceMessage(id, 'Приступай к выполнению этой задачи: вникни в контекст, определи ключевое и предложи, с чего начать.'); });
      return;
    }
    wsChatBody.innerHTML = turns.map(function(m){
      var who = m.role==='user' ? '&gt;' : (m.role==='system' ? '·' : '¤');
      var cls = m.role==='user' ? 'user' : (m.role==='system' ? 'system' : 'assistant');
      return '<div class="chat-line '+cls+'"><span class="who">'+who+'</span><span class="txt">'+esc(m.content)+'</span></div>';
    }).join('');
    wsChatBody.scrollTop = wsChatBody.scrollHeight;
  }

  function pushWorkspaceNote(id, text){
    workspaceChat[id] = workspaceChat[id] || [];
    workspaceChat[id].push({ role:'system', content:text, _ephemeral:true });
    if(workspaceOpenId===id) renderWorkspaceChat(id);
  }

  function taskSnapshotText(t){
    var proj = PROJECTS[t.project] || PROJECTS.other, lev = LEVERS[t.lever] || LEVERS.ops;
    return 'Проект: ' + proj.label + '\nРычаг роста: ' + lev.label + '\nНазвание: ' + t.title + '\n' +

      'Чек-лист: ' + (t.checklist && t.checklist.length ? t.checklist.map(function(c){ return (c.done?'[x] ':'[ ] ')+c.text; }).join('; ') : '(пусто)') + '\n' +
      'Ссылки: ' + (t.links && t.links.length ? t.links.map(function(l){ return l.label; }).join(', ') : '(нет)') + '\n' +
      'Файлы: ' + (t.attachments && t.attachments.length ? t.attachments.map(function(f){ return f.name; }).join(', ') : '(нет)');
