  function workspaceTools(id){
    return [{
      name: 'update_task',
      description: 'Обновить карточку этой задачи — заголовок, описание (notes), срок, проект/рычаг или чек-лист. checklist передаётся ЦЕЛИКОМ (полный список пунктов, которые должны остаться) и заменяет прежний. Вызывай notes/title/due/project/lever по мере того, как проясняется суть задачи. Чек-лист (checklist) трогай ТОЛЬКО когда пользователь сам просит завести, изменить или структурировать шаги/чек-лист — не добавляй и не переписывай его по своей инициативе.',
      inputSchema: { type:'object', properties: {
        title: { type:'string' }, notes: { type:'string' }, due: { type:'string', description:'YYYY-MM-DD или пустая строка' },
        project: { type:'string', enum:['metalizm','printbar','sprintami','other'] }, lever: { type:'string', enum:['sales','ops','scale'] },
        checklist: { type:'array', items: { type:'object', properties: { text:{type:'string'}, done:{type:'boolean'} }, required:['text'] } }
      } },
      execute: function(input){
        var patch = {};
        if(typeof input.title === 'string' && input.title.trim()) patch.title = input.title.slice(0,300);
        if(typeof input.notes === 'string') patch.notes = input.notes.slice(0,4000);
        if(typeof input.due === 'string') patch.due = input.due || null;
        if(input.project && PROJECTS[input.project]) patch.project = input.project;
        if(input.lever && LEVERS[input.lever]) patch.lever = input.lever;
        if(Array.isArray(input.checklist)) patch.checklist = input.checklist.map(function(c){ return { id: cuid(), text: String(c.text||'').slice(0,200), done: !!c.done }; });
        patchTask(id, patch);
        if(workspaceOpenId===id) renderWorkspaceLeft(id);
        pushWorkspaceNote(id, '✓ задача дополнена: ' + Object.keys(patch).join(', '));
        return { ok:true, updated: Object.keys(patch) };
      }
    },
    {
      name: 'attach_result_file',
      description: 'Прикрепить к задаче готовый результат работы как файл — он появится во вкладке «Файлы» этой задачи и открывается прямо в приложении по клику (просмотр внутри приложения, без выхода в браузер). Используй это, когда ты СОБРАЛ или ПОДГОТОВИЛ что-то конкретное и достаточно объёмное по задаче: анализ, сводку данных, черновик текста/КП, план, таблицу, расчёт. Не используй для коротких мыслей или ответов — тем достаточно обычного текста в чате. Само содержимое файла в переписке не сохраняется — если позже пользователь попросит зачитать или напомнить этот файл, используй read_attached_file, а не пересказывай по памяти и НЕ трогай чек-лист.',
      inputSchema: { type:'object', properties: {
        name: { type:'string', description: 'имя файла с расширением, например "анализ-конкурентов.md", "смета.csv", "черновик-кп.txt"' },
        content: { type:'string', description: 'полное содержимое файла целиком, как читаемый текст (markdown/csv/plain — без бинарных форматов)' }
      }, required: ['name','content'] },
      execute: function(input){
        var name = String(input.name||'файл.txt').trim().slice(0,150) || 'файл.txt';
        var content = String(input.content||'').slice(0,200000);
        if(!content.trim()) throw new Error('content пуст — нечего прикреплять');
        var ext = (name.match(/\.([a-zA-Z0-9]+)$/)||[])[1] || 'txt';
        var mimeMap = { md:'text/markdown', txt:'text/plain', csv:'text/csv', json:'application/json', html:'text/html' };
        var mime = (mimeMap[ext.toLowerCase()] || 'text/plain') + ';charset=utf-8';
        var dataUrl = 'data:' + mime + ';base64,' + utf8ToBase64(content);
        var t = state.tasks[id]; if(!t) throw new Error('задача не найдена');
        var attachments = (t.attachments || []).slice();
        attachments.push({ id: cuid(), name: name, type: mime, size: content.length, dataUrl: dataUrl });
        patchTask(id, { attachments: attachments });
        if(workspaceOpenId===id) renderWorkspaceLeft(id);
        pushWorkspaceNote(id, '✓ файл прикреплён: ' + name);
        return { ok:true, name: name };
      }
    },
    {
      name: 'read_attached_file',
      description: 'Прочитать содержимое уже прикреплённого к этой задаче текстового файла (например, того, что сам же приложил через attach_result_file). Используй это ЛЮБОЙ раз, когда пользователь просит зачитать, показать, прислать текстом, напомнить или процитировать содержимое файла — вместо того чтобы гадать по памяти или лезть в чек-лист. После вызова просто перескажи или процитируй полученный текст в обычном ответе.',
      inputSchema: { type:'object', properties: {
        name: { type:'string', description: 'имя файла (можно неточное/частичное) — если не указано, берётся последний прикреплённый файл' }
      } },
      execute: function(input){
        var t = state.tasks[id]; if(!t) throw new Error('задача не найдена');
        var files = t.attachments || [];
        if(!files.length) throw new Error('к этой задаче ещё не прикреплено ни одного файла');
        var wanted = String(input.name||'').trim().toLowerCase();
        var f = null;
        if(wanted){
          f = files.filter(function(x){ return x.name.toLowerCase()===wanted; })[0] ||
              files.filter(function(x){ return x.name.toLowerCase().indexOf(wanted)!==-1; })[0];
          if(!f) throw new Error('файл с именем похожим на «'+input.name+'» не найден среди: ' + files.map(function(x){ return x.name; }).join(', '));
        } else {
          f = files[files.length-1];
        }
        if(!(f.type && /^text\/|json/i.test(f.type))) throw new Error('файл «'+f.name+'» не текстовый ('+(f.type||'неизвестный формат')+') — прочитать как текст нельзя');
        var content = decodeDataUrlText(f.dataUrl);
        if(!content) throw new Error('не удалось прочитать содержимое файла «'+f.name+'»');
        return { name: f.name, content: content.slice(0, 20000) };
      }
    },
    {
      name: 'generate_image',
      description: 'Сгенерировать изображение по текстовому описанию (иллюстрация, визуал, мокап, баннер, референс для дизайна) и прикрепить его к задаче как файл — открывается прямо в приложении по клику. Используй, когда пользователь просит нарисовать, сгенерировать картинку, показать визуал/мокап/баннер.',
      inputSchema: { type:'object', properties: {
        prompt: { type:'string', description:'подробное описание изображения — стиль, объекты, композиция, цвета' },
        name: { type:'string', description:'имя файла, например "мокап-баннера.png" (необязательно)' }
      }, required:['prompt'] },
      execute: function(input){
        var prompt = String(input.prompt||'').trim();
        if(!prompt) throw new Error('prompt пуст — нечего рисовать');
        var name = String(input.name||'изображение.png').trim().slice(0,150) || 'изображение.png';
        if(!/\.(png|jpe?g)$/i.test(name)) name += '.png';
        return apiFetch('/image', { method:'POST', body: { prompt: prompt } }).then(function(res){
          if(!res || !res.b64) throw new Error('не удалось получить изображение от сервиса генерации');
          var dataUrl = 'data:image/png;base64,' + res.b64;
          var t = state.tasks[id]; if(!t) throw new Error('задача не найдена');
          var attachments = (t.attachments || []).slice();
          attachments.push({ id: cuid(), name: name, type: 'image/png', size: res.b64.length, dataUrl: dataUrl });
          patchTask(id, { attachments: attachments });
          if(workspaceOpenId===id) renderWorkspaceLeft(id);
          pushWorkspaceNote(id, '✓ изображение сгенерировано: ' + name);
          return { ok:true, name: name };
        });
      }
    }];
  }

  async function sendWorkspaceMessage(id, textOverride){
    var text = textOverride || wsChatInput.value.trim();
    if(!text) return;
    if(!textOverride) wsChatInput.value = '';

    workspaceChat[id] = workspaceChat[id] || [];
    var t = state.tasks[id];

    runChatSend(workspaceChat[id], text, {
      render: function(){ if(workspaceOpenId===id) renderWorkspaceChat(id); },
      disabledEphemeral: true,
      instructions: function(){
        return 'Ты — Клод, работающий как персональный ИСПОЛНИТЕЛЬ ВНУТРИ ОДНОЙ КОНКРЕТНОЙ ЗАДАЧИ трекера «Верстак». ' +
          fullBusinessContext() + '\n\n' +
          'Это не общий чат — весь разговор ниже относится только к этой задаче, и ты помнишь его целиком.\n\n' +
          'Текущее состояние задачи:\n' + taskSnapshotText(t) + '\n\n' +
          'Твоя роль здесь — не просто советовать, а РЕАЛЬНО ВЫПОЛНЯТЬ задачу: собирать из разговора и из контекста бизнеса нужные данные, доводить их до готового результата (анализ, расчёт, черновик текста/КП, план, сводка) и отдавать этот результат пользователю. ' +
          'Когда пользователь просит начать работу («приступай», «начни выполнять») — вникни в контекст, определи, с чего начать в первую очередь, и веди его по задаче шаг за шагом, при нехватке информации — задавай уточняющие вопросы. ' +
          'Как только у тебя готов содержательный результат по задаче (не короткая реплика, а собранный материал: аналитика, свод, черновик, таблица, план) — прикрепи его инструментом attach_result_file, чтобы он остался в задаче как читаемый файл, а не потерялся в переписке. Если по задаче нужна картинка (визуал, мокап, баннер, иллюстрация, референс) — используй инструмент generate_image, он сам сгенерирует и прикрепит изображение файлом. Само содержимое файла потом не хранится у тебя в памяти разговора — если пользователь попросит зачитать, показать или напомнить, что в файле, ВСЕГДА вызывай read_attached_file и цитируй/пересказывай полученный текст. Такие просьбы (зачитай, покажи, что там написано, напомни) — это НИКОГДА не повод трогать чек-лист или update_task, даже если ты не сразу понял, что именно нужно показать. ' +
          'Заголовок задачи, описание (notes) и срок обновляй инструментом update_task по мере того, как проясняется суть — это можно делать самостоятельно. А вот ЧЕК-ЛИСТ (checklist) в update_task трогай ТОЛЬКО когда пользователь сам явно просит завести, изменить или структурировать шаги/чек-лист — не переписывай и не дополняй его по своей инициативе и не используй его как замену прямому ответу на вопрос. ' +
          'Когда пользователь просто спрашивает совета — отвечай как советник, без инструментов. Пиши по-деловому, на русском, без markdown-списков в тексте самого ответа.';
      },
      tools: function(){ return workspaceTools(id); },
      cache: false,
      getCtl: function(){ return wsCtl; },
      setCtl: function(c){ wsCtl = c; },
      persist: function(){ persistWorkspaceChat(id); }
    });
  }
  wsChatSend.addEventListener('click', function(){ sendWorkspaceMessage(workspaceOpenId); });
  wsChatInput.addEventListener('keydown', function(e){ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendWorkspaceMessage(workspaceOpenId); } });

  /* ============ terminal chat: Claude captures & manages tasks ============ */
  var chatToggle = document.getElementById('chatToggle');
  var chatDrawer = document.getElementById('chatDrawer');
  var chatBody = document.getElementById('chatBody');
  var chatInput = document.getElementById('chatInput');
  var chatSend = document.getElementById('chatSend');
  var chatTurns = [];   // {role, content} sent to sample()
  var chatCtl = null;

  chatToggle.addEventListener('click', function(){ chatDrawer.hidden = false; chatToggle.hidden = true; refreshIcons(); renderChat(); chatInput.focus(); });
  document.getElementById('chatClose').addEventListener('click', function(){ chatDrawer.hidden = true; chatToggle.hidden = false; refreshIcons(); });

  function renderChat(){
    if(!chatTurns.length){
      chatBody.innerHTML = '<div class="chat-empty">Опишите дело — Клод сам заведёт задачу и определит проект / рычаг роста. Можно и спросить совета или попросить закрыть задачу.<br><br><b>Например:</b> «Заведи задачу — согласовать смету с Робертом по Седова 24, срок пятница» или «Что делать с задачей про Bitrix24?»</div>';
      return;
    }
    chatBody.innerHTML = chatTurns.map(function(m){
      var who = m.role==='user' ? '&gt;' : (m.role==='system' ? '·' : '¤');
      var cls = m.role==='user' ? 'user' : (m.role==='system' ? 'system' : 'assistant');
      return '<div class="chat-line '+cls+'"><span class="who">'+who+'</span><span class="txt">'+esc(m.content)+'</span></div>';
    }).join('');
    chatBody.scrollTop = chatBody.scrollHeight;
  }
  function pushSystemNote(text){
    chatTurns.push({ role:'system', content:text, _ephemeral:true });
    renderChat();
  }

  function chatTaskTools(){
    return [
      {
        name: 'create_task',
        description: 'Завести новую, уже структурированную задачу: не только название, но и краткое описание сути и, если задача составная — начальный чек-лист шагов. Сразу привязывается к проекту и рычагу роста. Возвращает id созданной задачи.',
        inputSchema: { type:'object', properties: {
          title: { type:'string' }, project: { type:'string', enum:['metalizm','printbar','sprintami','other'] },
          lever: { type:'string', enum:['sales','ops','scale'] }, due: { type:'string', description:'YYYY-MM-DD, необязательно' },
          notes: { type:'string', description:'краткое описание сути задачи и контекста — заполняй, если из разговора понятна суть' },
          checklist: { type:'array', description:'начальные шаги, если задача составная — необязательно', items: { type:'object', properties:{ text:{type:'string'} }, required:['text'] } }
        }, required:['title','project','lever'] },
        execute: function(input){
          var t = { id: uid(), title: String(input.title||'').slice(0,300), project: PROJECTS[input.project] ? input.project : 'other',
            lever: LEVERS[input.lever] ? input.lever : 'ops', due: input.due || null, dueTime:'', reminder:false,
            notes: input.notes ? String(input.notes).slice(0,1000) : '',
            checklist: Array.isArray(input.checklist) ? input.checklist.map(function(c){ return { id: cuid(), text: String(c.text||'').slice(0,200), done:false }; }) : [],
            links: [], attachments: [], status:'open', createdAt: Date.now() };
          saveTask(t);
          pushSystemNote('✓ задача создана: «' + t.title + '» → ' + PROJECTS[t.project].short + ' / ' + LEVERS[t.lever].label);
          return { id: t.id, title: t.title, project: t.project, lever: t.lever };
        }
      },
      {
        name: 'list_open_tasks',
        description: 'Список открытых задач пользователя (id, название, проект, рычаг, срок). Используй перед update_task, чтобы найти id по названию.',
        inputSchema: { type:'object', properties: {} },
        execute: function(){
          return allTasksArr().filter(function(t){ return t.status!=='done'; }).map(function(t){
            return { id:t.id, title:t.title, project:t.project, lever:t.lever, due:t.due||null };
          });
        }
      },
      {
        name: 'update_task',
        description: 'Изменить существующую задачу по id: отметить выполненной, перенести срок, дополнить заметку или переименовать.',
        inputSchema: { type:'object', properties: {
          id: { type:'string' }, status: { type:'string', enum:['open','done'] }, due: { type:'string' },
          notes: { type:'string' }, title: { type:'string' }
        }, required:['id'] },
        execute: function(input){
          var id = String(input.id||'');
          if(!state.tasks[id]) throw new Error('задача с таким id не найдена — сначала вызови list_open_tasks');
          var patch = {};
          if(input.status && (input.status==='open'||input.status==='done')) patch.status = input.status;
          if(typeof input.due === 'string') patch.due = input.due || null;
          if(typeof input.notes === 'string') patch.notes = input.notes.slice(0,1000);
          if(typeof input.title === 'string' && input.title.trim()) patch.title = input.title.slice(0,300);
          var updated = patchTask(id, patch);
          pushSystemNote('✓ задача обновлена: «' + updated.title + '»');
          return { id: id, ok: true };
        }
      }
    ];
  }

  async function sendChat(){
    var text = chatInput.value.trim(); if(!text) return;
    chatInput.value = '';

    var INSTRUCTIONS = 'Ты — Клод, личный бизнес-ассистент владельца, работающий внутри чата трекера задач «Верстак». ' + fullBusinessContext() + '\n\n' +
      'Когда пользователь описывает дело, которое нужно сделать — заведи задачу инструментом create_task, не только предлагай словами. ' +
      'Не ограничивайся голым названием: сразу структурируй задачу — коротко опиши суть и контекст в notes, а если дело составное, из нескольких шагов — заполни начальный checklist. ' +
      'Когда просит закрыть, перенести срок или изменить существующую задачу — сначала вызови list_open_tasks, найди нужный id по смыслу, затем update_task. ' +
      'Когда просит совета по задаче — дай короткий практичный совет без инструмента. Подробная работа над одной задачей (погружение, шаги, сбор информации) происходит не здесь, а в окне самой задачи — если пользователь хочет реально поработать над конкретной задачей, предложи открыть её. ' +
      'Отвечай по-деловому, коротко, на русском, без markdown-списков.';

    runChatSend(chatTurns, text, {
      render: renderChat,
      instructions: INSTRUCTIONS,
      tools: chatTaskTools,
      getCtl: function(){ return chatCtl; },
      setCtl: function(c){ chatCtl = c; }
    });
  }
  chatSend.addEventListener('click', sendChat);
  chatInput.addEventListener('keydown', function(e){ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendChat(); } });

  /* ============ дашборд: встроенный стратегический чат с Клодом ============ */
  var dashChatBody = document.getElementById('dashChatBody');
  var dashChatInput = document.getElementById('dashChatInput');
  var dashChatSend = document.getElementById('dashChatSend');
  var dashTurns = [];
  var dashCtl = null;

  function renderDashChat(){
    if(!dashChatBody) return;
    if(!dashTurns.length){
      dashChatBody.innerHTML = '<div class="chat-empty">Спросите, например: «Что сейчас самое узкое место в бизнесе?» или «Какое направление подтянуть в первую очередь?». Клод видит срез всех разделов — задачи, продажи, производство, кассу и цели.</div>';
      return;
    }
    dashChatBody.innerHTML = dashTurns.map(function(m){
      var who = m.role==='user' ? '&gt;' : (m.role==='system' ? '·' : '¤');
      var cls = m.role==='user' ? 'user' : (m.role==='system' ? 'system' : 'assistant');
      return '<div class="chat-line '+cls+'"><span class="who">'+who+'</span><span class="txt">'+esc(m.content)+'</span></div>';
    }).join('');
    dashChatBody.scrollTop = dashChatBody.scrollHeight;
  }

  async function sendDashChat(){
    if(!dashChatInput) return;
    var text = dashChatInput.value.trim(); if(!text) return;
    dashChatInput.value = '';

    var INSTRUCTIONS = function(){
      return 'Ты — Клод, стратегический бизнес-консультант владельца METALIZM (Telegram-бот с ИИ-продажами печати фото на металле), ' +
      'Принт Бар (выездная мобильная печать) и Спринтами (типография, широкоформатная печать). ' + fullBusinessContext() + '\n\n' +
      'Ты работаешь на главном дашборде трекера «Верстак» ' +
      'и видишь срез данных по всем разделам прямо сейчас:\n\n' + buildBusinessSummaryForAI() + '\n\n' +
      'Помогай анализировать сильные и слабые стороны бизнеса, отвечай на вопросы о приоритетах, стратегии и операционке, опираясь на эти данные. ' +
      'Отвечай по-деловому, коротко, на русском, без markdown-списков.';
    };

    runChatSend(dashTurns, text, {
      render: renderDashChat,
      instructions: INSTRUCTIONS,
      cache: false,
      getCtl: function(){ return dashCtl; },
      setCtl: function(c){ dashCtl = c; }
    });
  }
  if(dashChatSend) dashChatSend.addEventListener('click', sendDashChat);
  if(dashChatInput) dashChatInput.addEventListener('keydown', function(e){ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendDashChat(); } });

  render();
  initApp();
})();
</script>

</body></html>
